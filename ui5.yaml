# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zew.newscan.zewnewscan

type: application

server:
  customMiddleware:

    # ================= PROXY SAP =================
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false

        backend:
          - path: /sap
            url: http://swdev:443
            destination: S4H_DEV_ANDONIX

        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com

    # ================= RELOAD =================
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    # ================= PREVIEW =================
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
